<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14183a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g transform="translate(52 212) scale(1.12)">
  <circle cx="160" cy="500" r="240" fill="#6366f1" opacity="0.10"/>

  <!-- window -->
  <rect x="120" y="50" width="1103" height="469" rx="18" fill="#0f172a" stroke="#27334d" stroke-width="2"/>
  <rect x="120" y="50" width="1103" height="46" rx="18" fill="#162036"/>
  <rect x="120" y="76" width="1103" height="20" fill="#162036"/>
  <circle cx="150" cy="73" r="6" fill="#f87171"/><circle cx="172" cy="73" r="6" fill="#fbbf24"/><circle cx="194" cy="73" r="6" fill="#4ade80"/>

  <!-- chat column -->
  <rect x="150" y="120" width="470" height="52" rx="14" fill="#1d4ed8"/>
  <text x="170" y="152" font-size="16" fill="#fff">Generate a pricing card, make it dark with an indigo CTA</text>

  <g font-size="13" fill="#94a3b8">
    <rect x="150" y="190" width="150" height="26" rx="13" fill="#1e293b"/>
    <text x="168" y="208">search_flowbite_docs</text>
    <rect x="312" y="190" width="150" height="26" rx="13" fill="#1e293b"/>
    <text x="330" y="208">build_widget_card</text>
  </g>

  <!-- preview card -->
  <rect x="150" y="234" width="470" height="262" rx="14" fill="#111c33" stroke="#27334d"/>
  <rect x="150" y="234" width="470" height="38" rx="14" fill="#162036"/>
  <rect x="150" y="256" width="470" height="16" fill="#162036"/>
  <text x="170" y="259" font-size="13" font-weight="700" fill="#e2e8f0">Pricing card</text>
  <rect x="470" y="242" width="64" height="22" rx="6" fill="#4f46e5"/>
  <text x="502" y="257" text-anchor="middle" font-size="12" fill="#fff">Preview</text>
  <rect x="540" y="242" width="64" height="22" rx="6" fill="#1e293b"/>
  <text x="572" y="257" text-anchor="middle" font-size="12" fill="#94a3b8">Code</text>

  <rect x="260" y="288" width="250" height="190" rx="14" fill="#0b1220" stroke="#334155"/>
  <text x="285" y="318" font-size="14" fill="#94a3b8">Starter</text>
  <text x="285" y="356" font-size="32" font-weight="800" fill="#fff">$29<tspan font-size="14" font-weight="400" fill="#94a3b8"> /mo</tspan></text>
  <rect x="285" y="372" width="140" height="8" rx="4" fill="#334155"/>
  <rect x="285" y="392" width="110" height="8" rx="4" fill="#334155"/>
  <rect x="285" y="412" width="125" height="8" rx="4" fill="#334155"/>
  <rect x="285" y="434" width="200" height="32" rx="8" fill="#6366f1"/>
  <text x="385" y="455" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Get started</text>

  <!-- code panel -->
  <rect x="660" y="120" width="533" height="376" rx="14" fill="#0b1220" stroke="#27334d"/>
  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <text x="684" y="156" fill="#64748b">&lt;div class="</text>
    <text x="684" y="182" fill="#a5b4fc">  max-w-sm p-6 bg-gray-900</text>
    <text x="684" y="208" fill="#a5b4fc">  border border-gray-700 rounded-lg"&gt;</text>
    <text x="684" y="240" fill="#7dd3fc">  &lt;h5 class="mb-2 text-sm text-gray-400"&gt;</text>
    <text x="684" y="262" fill="#e2e8f0">    Starter</text>
    <text x="684" y="284" fill="#7dd3fc">  &lt;/h5&gt;</text>
    <text x="684" y="316" fill="#7dd3fc">  &lt;a class="bg-indigo-600 hover:bg-indigo-700</text>
    <text x="684" y="338" fill="#a5b4fc">     text-white rounded-lg px-5 py-2.5"&gt;</text>
    <text x="684" y="360" fill="#e2e8f0">    Get started</text>
    <text x="684" y="382" fill="#7dd3fc">  &lt;/a&gt;</text>
    <text x="684" y="404" fill="#64748b">&lt;/div&gt;</text>
  </g>
  <g font-size="13" fill="#94a3b8">
    <text x="684" y="448">Sources: flowbite.com/docs/components/cards</text>
    <text x="684" y="472" fill="#818cf8">RAG · tool calling · MCP · live preview</text>
  </g>
  </g>
  <text x="88" y="140" font-size="52" font-weight="800" fill="#f8fafc">Flowbite Agent</text>
  <rect x="88" y="162" width="72" height="5" rx="2.5" fill="#a5b4fc"/>
  <g>
    <rect x="88" y="862" width="67" height="40" rx="20" fill="#a5b4fc" fill-opacity="0.12" stroke="#a5b4fc" stroke-opacity="0.45"/>
    <text x="121.5" y="888" text-anchor="middle" font-size="18" font-weight="600" fill="#a5b4fc">RAG</text>
    <rect x="169" y="862" width="184" height="40" rx="20" fill="#a5b4fc" fill-opacity="0.12" stroke="#a5b4fc" stroke-opacity="0.45"/>
    <text x="261.0" y="888" text-anchor="middle" font-size="18" font-weight="600" fill="#a5b4fc">Tool Calling</text>
    <rect x="367" y="862" width="67" height="40" rx="20" fill="#a5b4fc" fill-opacity="0.12" stroke="#a5b4fc" stroke-opacity="0.45"/>
    <text x="400.5" y="888" text-anchor="middle" font-size="18" font-weight="600" fill="#a5b4fc">MCP</text>
    <rect x="448" y="862" width="119" height="40" rx="20" fill="#a5b4fc" fill-opacity="0.12" stroke="#a5b4fc" stroke-opacity="0.45"/>
    <text x="507.5" y="888" text-anchor="middle" font-size="18" font-weight="600" fill="#a5b4fc">FastAPI</text>
    <rect x="581" y="862" width="119" height="40" rx="20" fill="#a5b4fc" fill-opacity="0.12" stroke="#a5b4fc" stroke-opacity="0.45"/>
    <text x="640.5" y="888" text-anchor="middle" font-size="18" font-weight="600" fill="#a5b4fc">Next.js</text>
  </g>
</svg>
